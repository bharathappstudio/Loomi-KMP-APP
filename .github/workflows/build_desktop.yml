name: Build All Platforms

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Package
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./gradlew :desktop:packageMsi :desktop:packageExe --no-daemon
          else
            ./gradlew :desktop:packageDmg --no-daemon
          fi
        shell: bash

      - name: Prepare Windows Files
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path "desktop/build/compose/binaries/main/msi/*.msi", "desktop/build/compose/binaries/main/exe/*.exe" -DestinationPath "Loomi-Windows-Setup.zip"
        shell: pwsh

      - name: Prepare macOS Files
        if: matrix.os == 'macos-latest'
        run: |
          zip -j Loomi-Mac-Installer.zip desktop/build/compose/binaries/main/dmg/*.dmg
        shell: bash

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Loomi v1.0.${{ github.run_number }}"
          draft: false
          # This dynamic line fixes the "Pattern not matched" error
          files: ${{ matrix.os == 'windows-latest' && 'Loomi-Windows-Setup.zip' || 'Loomi-Mac-Installer.zip' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-release-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Handle Google Services File
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"0","android_client_info":{"package_name":"com.echo.loomi"}},"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json
          fi

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk Loomi-Android.apk

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Loomi v1.0.${{ github.run_number }}"
          draft: false
          files: Loomi-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
