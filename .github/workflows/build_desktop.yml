name: Build Desktop App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build EXE
        run: ./gradlew :desktop:packageExe
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Compress Windows Build
        run: |
          Compress-Archive -Path "desktop/build/compose/binaries/main/exe/*.exe" -DestinationPath "Loomi-Windows-Setup.zip"

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: Loomi-Windows-ZIP
          path: Loomi-Windows-Setup.zip
          retention-days: 1

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DMG
        run: ./gradlew :desktop:packageDmg

      - name: Compress macOS Build
        run: |
          zip -j Loomi-Mac-Setup.zip desktop/build/compose/binaries/main/dmg/*.dmg

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: Loomi-Mac-ZIP
          path: Loomi-Mac-Setup.zip
          retention-days: 1
