name: Build Desktop App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Package
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./gradlew :desktop:packageExe
          else
            ./gradlew :desktop:packageDmg
          fi
        shell: bash

      - name: Prepare Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path "desktop/build/compose/binaries/main/exe/*.exe" -DestinationPath "Loomi-Windows-Setup.zip"
        shell: pwsh

      - name: Prepare Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          zip -j Loomi-Mac-Setup.zip desktop/build/compose/binaries/main/dmg/*.dmg
        shell: bash

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Loomi Desktop v1.0.${{ github.run_number }}"
          draft: true
          files: |
            Loomi-Windows-Setup.zip
            Loomi-Mac-Setup.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
