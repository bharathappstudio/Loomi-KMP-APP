name: Release Desktop App

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            tasks: ":desktop:packageDeb"
          - os: windows-latest
            tasks: ":desktop:packageExe :desktop:packageMsi"
          - os: macos-latest
            tasks: ":desktop:packageDmg"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Packages
        run: ./gradlew ${{ matrix.tasks }} --info

      - name: Upload to Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Loomi Desktop - Latest Build' }}
          files: |
            desktop/build/compose/binaries/main/**/*.deb
            desktop/build/compose/binaries/main/**/*.exe
            desktop/build/compose/binaries/main/**/*.msi
            desktop/build/compose/binaries/main/**/*.dmg
          fail_on_unmatched_files: false
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The separate release job is no longer needed as each build job uploads directly
