name: Release Loomi App & Desktop Packages

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
  RELEASE_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Loomi Release - {0}', github.ref_name) }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  # Creates the release once, so the build jobs below don't race each other.
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail

          # For branch pushes, keep a rolling "latest" tag pointing at this commit
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            git tag -f "$RELEASE_TAG"
            git push -f origin "refs/tags/$RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, reusing it."
          else
            PRERELEASE=""
            if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
              PRERELEASE="--prerelease"
            fi
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_NAME" \
              --generate-notes \
              $PRERELEASE
          fi

  build-android:
    name: Build Android APK & SHA-256
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Android APK
        run: ./gradlew :app:assembleDebug

      - name: Generate SHA-256 Checksum for APK
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          cat app-debug.apk.sha256

      - name: Upload Android APK and SHA to Release
        run: |
          gh release upload "$RELEASE_TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/app-debug.apk.sha256 \
            --clobber

  build-desktop:
    name: Build Desktop on ${{ matrix.os }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            tasks: ":desktop:packageDeb"
          - os: windows-latest
            tasks: ":desktop:packageExe :desktop:packageMsi"
          - os: macos-latest
            tasks: ":desktop:packageDmg"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Desktop Packages
        run: ./gradlew ${{ matrix.tasks }} --info

      - name: Generate SHA-256 Checksum for Desktop Binaries
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd desktop/build/compose/binaries/main
          for f in */*.deb */*.exe */*.msi */*.dmg; do
            dir=$(dirname "$f")
            file=$(basename "$f")
            # sha256sum on Linux/Windows, shasum on macOS
            (cd "$dir" && { sha256sum "$file" 2>/dev/null || shasum -a 256 "$file"; } > "$file.sha256")
            cat "$dir/$file.sha256"
          done

      - name: Upload Desktop Packages and SHA to Release
        run: |
          shopt -s nullglob
          files=(
            desktop/build/compose/binaries/main/*/*.deb
            desktop/build/compose/binaries/main/*/*.exe
            desktop/build/compose/binaries/main/*/*.msi
            desktop/build/compose/binaries/main/*/*.dmg
            desktop/build/compose/binaries/main/*/*.sha256
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No desktop packages found to upload"
            exit 0
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
