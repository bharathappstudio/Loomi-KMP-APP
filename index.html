<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Projects / LOOMI — Loomi AI</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" />
  <style>
    * {
      box-sizing: border-box;
      border-radius: 0;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #161511;
    }

    .sn-root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      -webkit-font-smoothing: antialiased;
    }

    .sn-root[data-theme="dark"] {
      --bg: #161511;
      --bar: #1D1C17;
      --panel: #1A1914;
      --surface: #22201B;
      --codebg: #13120E;
      --fg: #FFFFFF;
      --fg-soft: #F2EFE9;
      --out-fg: #FFFFFF;
      --muted: #9A9487;
      --dim: #7A756A;
      --border: rgba(255, 255, 255, .08);
      --dash: rgba(255, 255, 255, .12);
      --tok-kw: #FF7B72;
      --tok-str: #79C0FF;
      --tok-fn: #D2A8FF;
      --tok-type: #FFA657;
      --tok-num: #7EE787;
      --tok-lit: #56D4DD;
      --tok-cmt: #7D8590;
    }

    .sn-root[data-theme="light"] {
      --bg: #F7F5EF;
      --bar: #EFECE4;
      --panel: #F2EFE7;
      --surface: #E6E2D8;
      --codebg: #ECE9E0;
      --fg: #171612;
      --fg-soft: #2A2822;
      --out-fg: #171612;
      --muted: #5E594E;
      --dim: #827C6F;
      --border: rgba(23, 22, 18, .12);
      --dash: rgba(23, 22, 18, .14);
      --tok-kw: #CF222E;
      --tok-str: #0A3069;
      --tok-fn: #8250DF;
      --tok-type: #953800;
      --tok-num: #116329;
      --tok-lit: #0550AE;
      --tok-cmt: #6E7781;
    }

    .sn-win {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      overflow: hidden;
      font-size: 13px;
      line-height: 1.7;
    }

    .sn-bar {
      flex: none;
      height: 42px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: color-mix(in srgb, var(--bar) 88%, transparent);
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      border-bottom: 1px solid var(--border);
      user-select: none;
      min-width: 0;
      z-index: 30;
    }

    .sn-dots {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: none;
      margin-right: 4px;
    }

    .sn-dots i {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      display: block;
      font-style: normal;
    }

    .sn-dots i:nth-child(1) { background: #FF5F56; }
    .sn-dots i:nth-child(2) { background: #FFBD2E; }
    .sn-dots i:nth-child(3) { background: #27C93F; }

    .sn-crumb {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 13.5px;
      letter-spacing: -0.015em;
      white-space: nowrap;
      overflow: hidden;
    }

    .sn-crumb-parent {
      color: var(--fg);
      font-weight: 500;
      flex: none;
      text-decoration: none;
      cursor: pointer;
      transition: color .15s ease;
    }
    .sn-crumb-parent:hover { color: var(--accent); }
    .sn-crumb-sep { color: var(--dim); font-weight: 400; flex: none; }
    .sn-crumb-current {
      color: var(--muted);
      font-weight: 400;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sn-bar-actions {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      flex: none;
    }

    .sn-bar-link {
      all: unset;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--muted);
      background: none;
      border: 0;
      padding: 0;
      white-space: nowrap;
      transition: color .15s ease;
    }

    .sn-bar-link:hover { color: var(--fg); }
    .sn-bar-link[data-active="true"] { color: var(--fg); }

    .sn-stage {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, .98fr) minmax(0, 1.02fr);
    }

    .sn-log {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px 24px 14px;
      color: var(--fg);
    }

    .sn-blk { flex: none; }

    .sn-prompt {
      display: flex;
      gap: 12px;
      color: var(--fg);
    }

    .sn-gt { color: var(--accent); font-weight: 600; flex: none; }
    .sn-ghost { visibility: hidden; }

    .sn-car {
      display: inline-block;
      width: 8px;
      height: 1.15em;
      background: var(--fg);
      vertical-align: -3px;
      margin-left: 2px;
      animation: sn-blink 1s steps(2, start) infinite;
    }

    @keyframes sn-blink {
      to { opacity: 0; }
    }

    .sn-steps {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }

    .sn-steps li {
      display: grid;
      grid-template-columns: 16px 62px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: baseline;
      color: var(--muted);
    }

    .sn-steps b { font-size: 9px; font-weight: 400; transform: translateY(-1px); }
    .sn-steps .v { color: var(--fg); }
    .sn-steps .d { min-width: 0; overflow-wrap: anywhere; }
    .sn-steps .t { color: var(--dim); font-size: 11.5px; }
    .sn-k-read b { color: #4B83E8; }
    .sn-k-edit b { color: #D99B26; }
    .sn-k-run b { color: #2E9E63; }

    .sn-res {
      margin-top: 8px;
      display: flex;
      gap: 10px;
      align-items: baseline;
      min-width: 0;
      color: var(--fg);
    }

    .sn-res span:last-child { min-width: 0; overflow-wrap: anywhere; }

    /* Mobile-style input card on desktop & mobile */
    .sn-form {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      padding: 14px 14px 12px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .sn-form input {
      width: 100%;
      min-width: 0;
      height: auto;
      min-height: 24px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 14px;
      line-height: 1.4;
      outline: none;
    }

    .sn-form input:focus { border: 0; }
    .sn-form > button[type="submit"] { display: none; }

    .sn-mob-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .sn-mob-icon {
      all: unset;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--codebg);
      color: var(--fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      line-height: 1;
      flex: none;
    }

    .sn-mob-pill {
      all: unset;
      cursor: pointer;
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--codebg);
      color: var(--fg);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      flex: none;
    }

    .sn-mob-spacer { flex: 1; min-width: 4px; }

    .sn-mob-mic {
      all: unset;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--codebg);
      color: var(--fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .sn-mob-send {
      all: unset;
      cursor: pointer;
      height: 36px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--fg);
      color: var(--bg);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex: none;
    }

    .sn-mob-send:disabled { opacity: .45; cursor: not-allowed; }
    .sn-err { margin-top: 6px; font-size: 11.5px; color: #D9534F; }
    .sn-plus { color: #2E9E63; }
    .sn-minus { color: #D9534F; }

    .sn-step-in { animation: sn-step-fade .2s ease-out both; }

    @keyframes sn-step-fade {
      from { opacity: .25; }
      to { opacity: 1; }
    }

    .sn-code {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      background: var(--panel);
      color: var(--out-fg);
    }

    .sn-ch {
      flex: none;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    .sn-file {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--fg-soft);
    }

    .sn-chip {
      margin-left: auto;
      flex: none;
      font-size: 11px;
      height: 22px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .sn-cb {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 12px 16px 24px;
      font-size: 12.5px;
      color: var(--out-fg);
      transform: translateZ(0);
    }

    .sn-empty { color: var(--dim); font-size: 12px; }

    .sn-out-row {
      display: flex;
      gap: 10px;
      align-items: baseline;
      color: var(--out-fg);
      font-size: 12.5px;
      line-height: 1.65;
      padding: 8px 0;
      border-bottom: 1px dashed var(--dash);
      overflow-wrap: anywhere;
    }

    .sn-out-row:last-child { border-bottom: 0; }
    .sn-out-num { color: var(--accent); font-weight: 600; flex: none; min-width: 18px; }
    .sn-ans-stack { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; color: var(--out-fg); }
    .sn-out-msg { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; color: var(--out-fg); }

    .sn-codebox { border: 1px solid var(--border); background: var(--codebg); overflow: hidden; }
    .sn-codebox-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .02em;
      color: var(--muted);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .sn-copy-btn {
      all: unset;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      padding: 1px 6px;
      border: 1px solid var(--border);
      background: var(--codebg);
      transition: color .15s ease, border-color .15s ease;
    }
    .sn-copy-btn:hover { color: var(--fg); border-color: var(--accent); }
    .sn-copy-btn[data-copied="true"] { color: #2E9E63; border-color: #2E9E63; }
    .sn-codebox-pre {
      margin: 0;
      padding: 8px 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.58;
      color: var(--out-fg);
    }
    .sn-code-line { display: flex; gap: 12px; padding: 0 12px; min-width: max-content; }
    .sn-ln-num { color: var(--dim); user-select: none; min-width: 20px; text-align: right; flex: none; }
    .sn-ln-body { white-space: pre; color: var(--out-fg); }

    .sn-tok-kw { color: var(--tok-kw); font-weight: 500; }
    .sn-tok-str { color: var(--tok-str); }
    .sn-tok-fn { color: var(--tok-fn); }
    .sn-tok-type { color: var(--tok-type); }
    .sn-tok-num { color: var(--tok-num); }
    .sn-tok-lit { color: var(--tok-lit); }
    .sn-tok-cmt { color: var(--tok-cmt); font-style: italic; }

    .sn-foot {
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px 10px 24px;
      border-top: 1px solid var(--border);
      background: var(--bar);
      font-size: 12px;
      color: var(--muted);
    }

    .sn-sum { display: grid; flex: 1; min-width: 0; }
    .sn-sum > span { grid-area: 1 / 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sn-hide { visibility: hidden; }
    .sn-acts { margin-left: auto; display: flex; gap: 8px; flex: none; }

    .sn-btn {
      all: unset;
      cursor: pointer;
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 12.5px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .sn-btn:hover { color: var(--fg); border-color: var(--accent); }

    .sn-merge {
      all: unset;
      cursor: pointer;
      height: 32px;
      padding: 0 14px;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--dim);
    }

    .sn-merge[data-lit="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .sn-merge[data-lit="true"]:hover { filter: brightness(1.06); }
    .sn-merge[aria-disabled="true"] { cursor: default; }
    .sn-merge kbd { font: inherit; font-size: 11px; opacity: .85; }

    /* Mobile UI: 100% full-screen output UI with bottom overlay input bar */
    @media (max-width: 760px) {
      .sn-foot { display: none; }

      .sn-stage {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
      }

      .sn-code {
        width: 100%;
        height: 100%;
        border-left: 0;
        border-bottom: 0;
      }

      .sn-cb {
        padding: 12px 12px 140px;
      }

      .sn-log {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: auto;
        min-height: 0;
        overflow: visible;
        justify-content: flex-end;
        padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
        border-left: 0;
        background: transparent;
        z-index: 25;
        pointer-events: none;
      }

      .sn-blk {
        width: 100%;
        pointer-events: auto;
      }

      .sn-prompt,
      .sn-steps,
      .sn-res {
        display: none;
      }

      .sn-form {
        margin-top: 0;
        box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
      }

      .sn-form input {
        font-size: 15px;
      }
    }

    @media (max-width: 560px) {
      .sn-win { font-size: 11.5px; line-height: 1.65; }
      .sn-bar { height: 40px; gap: 8px; padding: 0 12px; }
      .sn-dots { gap: 5px; }
      .sn-dots i { width: 9px; height: 9px; }
      .sn-crumb { font-size: 12px; gap: 6px; }
      .sn-bar-actions { gap: 10px; }
      .sn-bar-link { font-size: 11.5px; }
      .sn-ch { height: 34px; padding: 0 12px; font-size: 11px; }
      .sn-cb { font-size: 11.5px; padding: 10px 12px 140px; }
    }
  </style>
</head>
<body>
  <div id="app" class="sn-root" data-theme="dark" style="--accent: #F0542B;"></div>

  <script>
    (function () {
      const LOOMI_CHAT_URL = "https://api.groq.com/openai/v1/chat/completions";
      const LOOMI_MODELS_URL = "https://api.groq.com/openai/v1/models";
      const DEFAULT_MODEL = "openai/gpt-oss-20b";
      const DEFAULT_TEST_KEY = "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";
      const DEFAULT_SYSTEM_PROMPT = "You are Loomi AI, a helpful, accurate TypeScript and AI engineering assistant. Remember details and facts the user shares earlier in the conversation (such as their name or preferences) and answer follow-up questions accurately using the conversation history. Keep answers clear, concise, and direct.";
      const WEB_CACHE_KEY = "loomi_ai_feed_v1";

      const CODE_KEYWORDS = /\b(import|export|from|const|let|var|function|async|await|return|if|else|for|while|switch|case|break|continue|class|interface|type|extends|implements|new|try|catch|finally|throw|typeof|keyof|as|def|fn|pub|struct|enum|impl|select|from|where|insert|update|delete|create|table)\b/;
      const CODE_LITERALS = /\b(true|false|null|undefined|void|never|any|string|number|boolean|object)\b/;

      const codeBlockStore = new Map();
      let codeBlockCounter = 0;

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function highlightCodeLineHtml(line) {
        const regex = /(\/\/.*$|#.*$|\/\*[\s\S]*?\*\/|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`|\b\d+(?:\.\d+)?\b|\b[A-Z][A-Za-z0-9_]*\b|\b[A-Za-z_][A-Za-z0-9_]*\b)/gm;
        let out = "";
        let lastIndex = 0;
        let match;

        while ((match = regex.exec(line)) !== null) {
          if (match.index > lastIndex) {
            out += escapeHtml(line.slice(lastIndex, match.index));
          }

          const word = match[0];
          let cls = "";

          if (word.startsWith("//") || word.startsWith("#") || word.startsWith("/*")) {
            cls = "sn-tok-cmt";
          } else if (word.startsWith('"') || word.startsWith("'") || word.startsWith("`")) {
            cls = "sn-tok-str";
          } else if (/^\d/.test(word)) {
            cls = "sn-tok-num";
          } else if (CODE_KEYWORDS.test(word)) {
            cls = "sn-tok-kw";
          } else if (CODE_LITERALS.test(word)) {
            cls = "sn-tok-lit";
          } else if (/^[A-Z]/.test(word)) {
            cls = "sn-tok-type";
          } else if (line[match.index + word.length] === "(") {
            cls = "sn-tok-fn";
          }

          if (cls) {
            out += `<span class="${cls}">${escapeHtml(word)}</span>`;
          } else {
            out += escapeHtml(word);
          }

          lastIndex = match.index + word.length;
        }

        if (lastIndex < line.length) {
          out += escapeHtml(line.slice(lastIndex));
        }

        return out;
      }

      function renderFormattedAnswerHtml(text) {
        const segments = [];
        const fenceRegex = /```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g;
        let last = 0;
        let m;

        while ((m = fenceRegex.exec(text)) !== null) {
          if (m.index > last) {
            const prose = text.slice(last, m.index).trim();
            if (prose) segments.push({ kind: "text", content: prose });
          }
          segments.push({
            kind: "code",
            lang: (m[1] || "code").toLowerCase(),
            content: (m[2] || "").replace(/\n$/, ""),
          });
          last = m.index + m[0].length;
        }

        if (last < text.length) {
          const tail = text.slice(last).trim();
          if (tail) segments.push({ kind: "text", content: tail });
        }

        if (segments.length === 0) {
          return `<span class="sn-out-msg">${escapeHtml(text)}</span>`;
        }

        return `<div class="sn-ans-stack">${segments.map((seg) => {
          if (seg.kind === "text") {
            return `<div class="sn-out-msg">${escapeHtml(seg.content)}</div>`;
          }
          const blockId = "cb_" + (++codeBlockCounter);
          codeBlockStore.set(blockId, seg.content);
          const lines = seg.content.split("\n");
          return `
            <div class="sn-codebox">
              <div class="sn-codebox-hdr">
                <span>${escapeHtml(seg.lang || "code")}</span>
                <button type="button" class="sn-copy-btn" data-copy-id="${blockId}">Copy</button>
              </div>
              <pre class="sn-codebox-pre"><code>${lines.map((ln, i) => `
                <div class="sn-code-line">
                  <span class="sn-ln-num">${i + 1}</span>
                  <span class="sn-ln-body">${highlightCodeLineHtml(ln)}</span>
                </div>
              `).join("")}</code></pre>
            </div>
          `;
        }).join("")}</div>`;
      }

      async function copyTextToClipboard(text) {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch {}
        }
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok;
        } catch {
          return false;
        }
      }

      function renderStatsHtml(text) {
        return String(text || "")
          .split(/(✓[^·|]*|(?:^|\s)\+\d+|(?:^|\s)[−-]\d+)/)
          .map((part) => {
            if (!part) return "";
            const trimmed = part.trim();
            if (/^✓/.test(trimmed) || /^\+\d+$/.test(trimmed)) {
              return `<span class="sn-plus">${escapeHtml(part)}</span>`;
            }
            if (/^[−-]\d+$/.test(trimmed)) {
              return `<span class="sn-minus">${escapeHtml(part)}</span>`;
            }
            return escapeHtml(part);
          })
          .join("");
      }

      function parseSteps(raw) {
        return (raw || "")
          .split("\n")
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => {
            const [verb = "", detail = "", time = ""] = line.split("|").map((x) => x.trim());
            const v = verb.toLowerCase();
            const kind = /edit|write|create|delete|refactor/.test(v)
              ? "edit"
              : /run|test|build|check|lint|deploy|ai/.test(v)
                ? "run"
                : "read";
            return { verb, detail, time, kind };
          });
      }

      function loadCachedFeed() {
        try {
          const raw = window.localStorage.getItem(WEB_CACHE_KEY) || window.sessionStorage.getItem(WEB_CACHE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed.filter((item) => item && typeof item.prompt === "string" && typeof item.answer === "string");
        } catch {
          return [];
        }
      }

      function saveCachedFeed(entries) {
        try {
          const serialized = JSON.stringify(entries);
          window.localStorage.setItem(WEB_CACHE_KEY, serialized);
          window.sessionStorage.setItem(WEB_CACHE_KEY, serialized);
        } catch {}
      }

      function clearCachedFeed() {
        try {
          window.localStorage.removeItem(WEB_CACHE_KEY);
          window.sessionStorage.removeItem(WEB_CACHE_KEY);
        } catch {}
      }

      class LoomiClient {
        constructor(apiKey, model) {
          this.apiKey = (apiKey || DEFAULT_TEST_KEY).trim();
          this.model = (model || DEFAULT_MODEL).trim();
          this.resolvedModel = null;
        }

        async discoverAvailableModel() {
          const res = await fetch(LOOMI_MODELS_URL, {
            method: "GET",
            headers: {
              Authorization: `Bearer ${this.apiKey}`,
              "Content-Type": "application/json",
            },
          });
          if (!res.ok) return DEFAULT_MODEL;
          const json = await res.json();
          const models = Array.isArray(json?.data) ? json.data : [];
          const activeChatModel = models.find(
            (m) => m?.id && m.active !== false && !/whisper|tts|playai|guard|embed/i.test(m.id)
          );
          return activeChatModel?.id || models[0]?.id || DEFAULT_MODEL;
        }

        async postChat(modelToUse, history, nextPrompt, systemPrompt, temperature, maxCompletionTokens) {
          const messages = [
            { role: "system", content: systemPrompt || DEFAULT_SYSTEM_PROMPT },
          ];
          const priorTurns = Array.isArray(history) ? history.slice(-24) : [];
          for (const item of priorTurns) {
            if (item && typeof item.prompt === "string" && item.prompt.trim()) {
              messages.push({ role: "user", content: item.prompt.trim() });
            }
            if (item && typeof item.answer === "string" && item.answer.trim()) {
              messages.push({ role: "assistant", content: item.answer.trim() });
            }
          }
          messages.push({ role: "user", content: nextPrompt });

          return fetch(LOOMI_CHAT_URL, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${this.apiKey}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              model: modelToUse,
              temperature,
              max_completion_tokens: maxCompletionTokens,
              stream: false,
              messages,
            }),
          });
        }

        async ask(params) {
          let modelToUse = this.resolvedModel || this.model;
          let res = await this.postChat(
            modelToUse,
            params.history,
            params.prompt,
            params.systemPrompt,
            params.temperature,
            params.maxCompletionTokens
          );

          if (res.status === 404) {
            const errBody = await res.text();
            if (errBody.includes("model_not_found")) {
              const fallbackModel = await this.discoverAvailableModel();
              modelToUse = fallbackModel;
              this.resolvedModel = fallbackModel;
              res = await this.postChat(
                modelToUse,
                params.history,
                params.prompt,
                params.systemPrompt,
                params.temperature,
                params.maxCompletionTokens
              );
            } else {
              throw new Error(`Loomi AI error (404): ${errBody}`);
            }
          }

          if (!res.ok) {
            const errText = await res.text();
            throw new Error(`Loomi AI error (${res.status}): ${errText}`);
          }

          const data = await res.json();
          const aiText = data.choices?.[0]?.message?.content?.trim() || "No response content returned by model.";

          return {
            entry: {
              id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
              prompt: params.prompt,
              answer: aiText,
              model: data.model || modelToUse,
              createdAt: Date.now(),
            },
            totalTokens: data.usage?.total_tokens,
          };
        }
      }

      const rootEl = document.getElementById("app");
      const loomiClient = new LoomiClient(DEFAULT_TEST_KEY, DEFAULT_MODEL);

      const initialRun = {
        tab: "LOOMI",
        path: "~/loomi",
        task: "Start a fresh Loomi AI chat session",
        steps: "Read | src/ai/Loomi.ai | 0.2s\nEdit | src/ai/Loomi.ai +28 | 0.9s\nRun | tsc --noEmit ✓ 0 errors | 1.4s",
        file: "src/ai/Loomi.ai",
        stat: "+28 −2",
        diff: "",
        summary: "ready for new chat",
        done: "ready",
        aiResponse: "",
      };

      const state = {
        theme: window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light",
        activeRun: { ...initialRun },
        feed: loadCachedFeed(),
        promptInput: "",
        loading: false,
        errorMsg: null,
        merged: false,
        t: Infinity,
        playing: false,
        userScrolledUp: false,
        fastMode: true,
      };

      rootEl.addEventListener("click", async (ev) => {
        const copyBtn = ev.target.closest("[data-copy-id]");
        if (!copyBtn) return;
        const blockId = copyBtn.getAttribute("data-copy-id");
        const codeText = codeBlockStore.get(blockId) || "";
        const ok = await copyTextToClipboard(codeText);
        if (ok) {
          copyBtn.textContent = "Copied";
          copyBtn.setAttribute("data-copied", "true");
          setTimeout(() => {
            copyBtn.textContent = "Copy";
            copyBtn.removeAttribute("data-copied");
          }, 1500);
        }
      });

      function buildTimeline(taskText, stepsRaw, answerText, speed) {
        const k = 1 / Math.max(0.25, speed || 1);
        const steps = parseSteps(stepsRaw);
        const type = Math.min(900, Math.max(350, (taskText || "").length * 14)) * k;
        const s0 = type + 140 * k;
        const step = 240 * k;
        const a0 = s0 + Math.max(1, steps.length) * step + 80 * k;
        const answerDur = Math.min(800, Math.max(200, (answerText || "").length * 3)) * k;
        const end = a0 + answerDur + 100 * k;
        return { type, s0, step, a0, answerDur, end, steps };
      }

      function scrollFeedToBottom(force = false) {
        const scrollEl = document.getElementById("feed-scroll");
        if (!scrollEl) return;
        if (force || !state.userScrolledUp) {
          scrollEl.scrollTop = scrollEl.scrollHeight;
        }
      }

      function buildRowHtml(item, idxNum, textOverride) {
        const bodyText = typeof textOverride === "string" ? textOverride : item.answer;
        return `
          <div class="sn-out-row" data-row-id="${escapeHtml(item.id)}">
            <span class="sn-out-num">${idxNum + 1}</span>
            <div class="sn-ans-stack" data-ans-container>
              ${renderFormattedAnswerHtml(bodyText)}
            </div>
          </div>
        `;
      }

      function renderFeedRows(visibleOutputs, live, answerProgress, tl) {
        const scrollEl = document.getElementById("feed-scroll");
        if (!scrollEl) return;

        if (visibleOutputs.length === 0) {
          const emptyMsg = live && state.t < tl.a0
            ? "writing…"
            : "Send a message to Loomi AI to see output.";
          scrollEl.innerHTML = `<div class="sn-empty">${escapeHtml(emptyMsg)}</div>`;
          return;
        }

        const emptyEl = scrollEl.querySelector(".sn-empty");
        if (emptyEl) emptyEl.remove();

        const existingRows = Array.from(scrollEl.querySelectorAll(".sn-out-row"));
        if (existingRows.length > visibleOutputs.length) {
          for (let i = visibleOutputs.length; i < existingRows.length; i++) {
            existingRows[i].remove();
          }
        }

        for (let idxNum = 0; idxNum < visibleOutputs.length; idxNum++) {
          const item = visibleOutputs[idxNum];
          const isLatest = idxNum === visibleOutputs.length - 1;
          const fullAnswer = item.answer;
          const targetAnswer = isLatest && live
            ? fullAnswer.slice(0, Math.max(1, Math.round(fullAnswer.length * answerProgress)))
            : fullAnswer;

          let rowEl = scrollEl.querySelector(`.sn-out-row[data-row-id="${CSS.escape(item.id)}"]`);
          if (!rowEl) {
            const temp = document.createElement("div");
            temp.innerHTML = buildRowHtml(item, idxNum, targetAnswer);
            rowEl = temp.firstElementChild;
            scrollEl.appendChild(rowEl);
          } else {
            const numEl = rowEl.querySelector(".sn-out-num");
            if (numEl && numEl.textContent !== String(idxNum + 1)) {
              numEl.textContent = String(idxNum + 1);
            }
            const prevRendered = rowEl.getAttribute("data-rendered-text");
            if (prevRendered !== targetAnswer) {
              const ansContainer = rowEl.querySelector("[data-ans-container]");
              if (ansContainer) {
                ansContainer.innerHTML = renderFormattedAnswerHtml(targetAnswer);
              }
            }
          }
          rowEl.setAttribute("data-rendered-text", targetAnswer);
        }
      }

      function render(options = {}) {
        const preserveInputFocus = Boolean(options.preserveInputFocus);
        const forceScrollBottom = Boolean(options.forceScrollBottom);
        const feedOnly = Boolean(options.feedOnly);

        rootEl.setAttribute("data-theme", state.theme);
        document.body.style.background = state.theme === "dark" ? "#161511" : "#F7F5EF";

        const latestAnswer = state.feed.length > 0
          ? state.feed[state.feed.length - 1].answer
          : state.activeRun.aiResponse || "";

        const tl = buildTimeline(state.activeRun.task, state.activeRun.steps, latestAnswer, 1);
        const done = state.t >= tl.end;
        const live = state.playing && Number.isFinite(state.t);
        const typed = Number.isFinite(state.t)
          ? Math.round((state.activeRun.task || "").length * Math.min(1, state.t / tl.type))
          : (state.activeRun.task || "").length;
        const ns = state.t < tl.s0
          ? 0
          : Math.min(tl.steps.length, 1 + Math.floor((state.t - tl.s0) / tl.step));
        const answerProgress = !live
          ? 1
          : state.t < tl.a0
            ? 0
            : Math.min(1, (state.t - tl.a0) / Math.max(1, tl.answerDur));
        const visibleOutputs = live && state.t < tl.a0
          ? state.feed.slice(0, Math.max(0, state.feed.length - 1))
          : state.feed;

        if (feedOnly && rootEl.querySelector("#feed-scroll")) {
          const chipEl = rootEl.querySelector(".sn-chip");
          if (chipEl) chipEl.textContent = `${state.feed.length} saved`;
          renderFeedRows(visibleOutputs, live, answerProgress, tl);
          if (forceScrollBottom) scrollFeedToBottom(true);
          return;
        }

        const canSend = !state.loading && state.promptInput.trim().length > 0;

        const stepsHtml = tl.steps
          .slice(0, ns)
          .map((s) => `
            <li class="sn-k-${s.kind}${live ? " sn-step-in" : ""}">
              <b aria-hidden="true">●</b>
              <span class="v">${escapeHtml(s.verb)}</span>
              <span class="d">${renderStatsHtml(s.detail)}</span>
              <span class="t">${escapeHtml(s.time)}</span>
            </li>
          `)
          .join("");

        rootEl.innerHTML = `
          <div class="sn-win">
            <div class="sn-bar">
              <div class="sn-dots" aria-hidden="true"><i></i><i></i><i></i></div>
              <div class="sn-crumb">
                <a class="sn-crumb-parent" href="https://bharathappstudio.github.io">Projects</a>
                <span class="sn-crumb-sep" aria-hidden="true">/</span>
                <span class="sn-crumb-current">${escapeHtml((state.activeRun.tab || "LOOMI").toUpperCase())}</span>
              </div>
              <div class="sn-bar-actions">
                <button type="button" class="sn-bar-link" id="btn-new-chat" aria-label="New Chat">New Chat</button>
                <button type="button" class="sn-bar-link" id="btn-theme" data-active="${state.theme === "dark"}" aria-label="Toggle Light or Dark theme">${state.theme === "dark" ? "Dark" : "Light"}</button>
              </div>
            </div>

            <div class="sn-stage">
              <div class="sn-log">
                <div class="sn-blk">
                  <div class="sn-prompt">
                    <span class="sn-gt" aria-hidden="true">›</span>
                    <span>
                      ${escapeHtml((state.activeRun.task || "").slice(0, typed))}
                      ${state.t < tl.s0 ? `<span class="sn-car" aria-hidden="true"></span>` : ""}
                      <span class="sn-ghost" aria-hidden="true">${escapeHtml((state.activeRun.task || "").slice(typed))}</span>
                    </span>
                  </div>

                  <ul class="sn-steps">${stepsHtml}</ul>

                  ${done ? `
                    <div class="sn-res${live || state.merged ? " sn-step-in" : ""}">
                      <span class="${state.merged ? "sn-plus" : "sn-gt"}">${state.merged ? "✓" : "●"}</span>
                      <span>${escapeHtml(state.merged ? "Merged into main" : (state.activeRun.done || "ready"))} · ${renderStatsHtml(state.activeRun.summary || "")}</span>
                    </div>
                  ` : ""}

                  <form class="sn-form" id="chat-form">
                    <input
                      type="text"
                      id="prompt-input"
                      value="${escapeHtml(state.promptInput)}"
                      placeholder="Ask Loomi AI..."
                      ${state.loading ? "disabled" : ""}
                    />
                    <button type="submit" id="send-btn" ${canSend ? "" : "disabled"}>
                      ${state.loading ? "Sending…" : "Send"}
                    </button>
                    <div class="sn-mob-tools">
                      <button type="button" class="sn-mob-icon" id="mob-plus-btn" aria-label="New Chat">+</button>
                      <button type="button" class="sn-mob-pill" id="mob-mode-btn" aria-label="Toggle speed mode">
                        <span>⚡</span>
                        <span>${state.fastMode ? "Fast" : "Full"}</span>
                        <span>⌄</span>
                      </button>
                      <div class="sn-mob-spacer"></div>
                      <button type="button" class="sn-mob-mic" id="mob-mic-btn" aria-label="Voice input">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                          <path d="M5 10v2a7 7 0 0 0 14 0v-2"></path>
                          <line x1="12" y1="19" x2="12" y2="22"></line>
                        </svg>
                      </button>
                      <button type="submit" class="sn-mob-send" id="mob-send-btn" ${canSend ? "" : "disabled"}>
                        <span>${state.loading ? "Sending…" : "Send"}</span>
                      </button>
                    </div>
                  </form>

                  ${state.errorMsg ? `<div class="sn-err">${escapeHtml(state.errorMsg)}</div>` : ""}
                </div>
              </div>

              <div class="sn-code" aria-label="src/ai/Loomi.ai">
                <div class="sn-ch">
                  <span class="sn-file">src/ai/Loomi.ai</span>
                  <span class="sn-chip">${state.feed.length} saved</span>
                </div>
                <div class="sn-cb" id="feed-scroll"></div>
              </div>
            </div>

            <div class="sn-foot">
              <div class="sn-sum">
                <span class="${done && !state.merged ? "" : "sn-hide"}">${renderStatsHtml(state.activeRun.summary || "")}</span>
                <span class="${!done && !state.merged ? "" : "sn-hide"}">working…</span>
                <span class="${state.merged ? "sn-plus" : "sn-hide"}">✓ Merged into main</span>
              </div>
              <div class="sn-acts">
                <button type="button" class="sn-btn" id="btn-replay" aria-label="Replay">
                  <span>↻</span>
                  <span class="sn-rl">Replay</span>
                </button>
                <button
                  type="button"
                  class="sn-merge"
                  id="btn-merge"
                  data-lit="${done && !state.merged}"
                  aria-disabled="${!done || state.merged}"
                >
                  <span>${state.merged ? "Merged into main" : "Merge"}</span>
                  ${!state.merged ? "<kbd>↵</kbd>" : ""}
                </button>
              </div>
            </div>
          </div>
        `;

        renderFeedRows(visibleOutputs, live, answerProgress, tl);

        const scrollEl = document.getElementById("feed-scroll");
        if (scrollEl) {
          scrollEl.addEventListener("scroll", () => {
            const distanceFromBottom = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight;
            state.userScrolledUp = distanceFromBottom > 48;
          }, { passive: true });
        }

        const inputEl = document.getElementById("prompt-input");
        if (inputEl) {
          inputEl.addEventListener("input", (ev) => {
            state.promptInput = ev.target.value;
            const disabled = state.loading || !state.promptInput.trim();
            const sendBtn = document.getElementById("send-btn");
            if (sendBtn) sendBtn.disabled = disabled;
            const mobSendBtn = document.getElementById("mob-send-btn");
            if (mobSendBtn) mobSendBtn.disabled = disabled;
          });
          if (preserveInputFocus && !state.loading) {
            inputEl.focus();
            const len = inputEl.value.length;
            inputEl.setSelectionRange(len, len);
          }
        }

        const mobPlusBtn = document.getElementById("mob-plus-btn");
        if (mobPlusBtn) mobPlusBtn.addEventListener("click", handleNewChat);

        const mobModeBtn = document.getElementById("mob-mode-btn");
        if (mobModeBtn) {
          mobModeBtn.addEventListener("click", () => {
            state.fastMode = !state.fastMode;
            render({ preserveInputFocus: document.activeElement && document.activeElement.id === "prompt-input" });
          });
        }

        const mobMicBtn = document.getElementById("mob-mic-btn");
        if (mobMicBtn) {
          mobMicBtn.addEventListener("click", () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
              if (inputEl) inputEl.focus();
              return;
            }
            const rec = new SpeechRecognition();
            rec.lang = "en-US";
            rec.interimResults = false;
            rec.onresult = (event) => {
              const spoken = event.results?.[0]?.[0]?.transcript || "";
              if (spoken) {
                state.promptInput = (state.promptInput ? state.promptInput + " " : "") + spoken;
                render({ preserveInputFocus: true });
              }
            };
            rec.start();
          });
        }

        const formEl = document.getElementById("chat-form");
        if (formEl) formEl.addEventListener("submit", handleSubmit);

        const newChatBtn = document.getElementById("btn-new-chat");
        if (newChatBtn) newChatBtn.addEventListener("click", handleNewChat);

        const themeBtn = document.getElementById("btn-theme");
        if (themeBtn) {
          themeBtn.addEventListener("click", () => {
            state.theme = state.theme === "dark" ? "light" : "dark";
            render({ preserveInputFocus: document.activeElement && document.activeElement.id === "prompt-input" });
          });
        }

        const replayBtn = document.getElementById("btn-replay");
        if (replayBtn) replayBtn.addEventListener("click", startOneShot);

        const mergeBtn = document.getElementById("btn-merge");
        if (mergeBtn) {
          mergeBtn.addEventListener("click", () => {
            if (state.t >= tl.end && !state.merged) {
              state.merged = true;
              state.t = Infinity;
              state.playing = false;
              render({ preserveInputFocus: document.activeElement && document.activeElement.id === "prompt-input" });
            }
          });
        }

        if (forceScrollBottom) {
          requestAnimationFrame(() => scrollFeedToBottom(true));
        }
      }

      let rafId = null;
      let lastBucket = "";

      function stopAnimation() {
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
        lastBucket = "";
        state.playing = false;
        state.t = Infinity;
      }

      function startOneShot() {
        stopAnimation();
        state.merged = false;
        state.userScrolledUp = false;

        const latestAnswer = state.feed.length > 0
          ? state.feed[state.feed.length - 1].answer
          : state.activeRun.aiResponse || "";
        const tl = buildTimeline(state.activeRun.task, state.activeRun.steps, latestAnswer, 1);
        const startAt = performance.now();

        state.playing = true;
        state.t = 0;
        render({ forceScrollBottom: true });

        function tick(now) {
          if (!state.playing) return;
          if (document.hidden) {
            stopAnimation();
            render({ forceScrollBottom: true });
            return;
          }

          const elapsed = now - startAt;
          if (elapsed >= tl.end) {
            stopAnimation();
            render({ forceScrollBottom: true });
            return;
          }

          state.t = elapsed;
          const typed = Math.round((state.activeRun.task || "").length * Math.min(1, elapsed / tl.type));
          const ns = elapsed < tl.s0
            ? 0
            : Math.min(tl.steps.length, 1 + Math.floor((elapsed - tl.s0) / tl.step));
          const ansChars = elapsed < tl.a0
            ? 0
            : Math.max(1, Math.round(latestAnswer.length * Math.min(1, (elapsed - tl.a0) / Math.max(1, tl.answerDur))));
          const stepBucket = `${typed}:${ns}`;
          const ansBucket = `${ansChars}`;

          if (stepBucket !== lastBucket.split("|")[0]) {
            lastBucket = `${stepBucket}|${ansBucket}`;
            const activeId = document.activeElement && document.activeElement.id;
            render({ preserveInputFocus: activeId === "prompt-input", forceScrollBottom: false });
          } else if (ansBucket !== (lastBucket.split("|")[1] || "")) {
            lastBucket = `${stepBucket}|${ansBucket}`;
            render({ feedOnly: true, forceScrollBottom: false });
          }

          rafId = requestAnimationFrame(tick);
        }

        rafId = requestAnimationFrame(tick);
      }

      function handleNewChat() {
        stopAnimation();
        codeBlockStore.clear();
        clearCachedFeed();
        state.feed = [];
        state.promptInput = "";
        state.errorMsg = null;
        state.merged = false;
        state.userScrolledUp = false;
        state.activeRun = {
          tab: "LOOMI",
          path: state.activeRun.path || "~/loomi",
          task: "New chat started — old data cleared",
          steps: [
            "Read | new-chat session | 0.1s",
            "Edit | web-cache cleared (∞) | 0.1s",
            "Run | Loomi AI ready ✓ 0 errors | 0.2s",
          ].join("\n"),
          file: "src/ai/Loomi.ai",
          stat: "0",
          diff: "",
          summary: "0 saved · fresh chat",
          done: "ready",
          aiResponse: "",
        };
        render({ forceScrollBottom: true });
      }

      async function handleSubmit(e) {
        e.preventDefault();
        const cleanPrompt = state.promptInput.trim();
        if (!cleanPrompt || state.loading) return;

        state.errorMsg = null;
        state.loading = true;
        stopAnimation();
        render();

        try {
          const historySnapshot = state.feed.slice();
          const { entry, totalTokens } = await loomiClient.ask({
            prompt: cleanPrompt,
            history: historySnapshot,
            systemPrompt: DEFAULT_SYSTEM_PROMPT,
            temperature: state.fastMode ? 0.5 : 0.7,
            maxCompletionTokens: state.fastMode ? 768 : 1024,
          });

          const nextFeed = [...historySnapshot, entry];
          state.feed = nextFeed;
          saveCachedFeed(nextFeed);

          const tokenSuffix = typeof totalTokens === "number" ? ` · ${totalTokens} tokens` : "";
          state.activeRun = {
            tab: "LOOMI",
            path: state.activeRun.path || "~/loomi",
            task: cleanPrompt,
            steps: [
              `Read | prompt #${nextFeed.length} (${cleanPrompt.length} chars) | 0.2s`,
              `Edit | web-cache (${nextFeed.length} saved) | 0.4s`,
              `Run | ${entry.model} ✓ 0 errors | 0.9s`,
            ].join("\n"),
            file: "src/ai/Loomi.ai",
            stat: `#${nextFeed.length}`,
            diff: "",
            summary: `${nextFeed.length} saved · ${entry.model}${tokenSuffix}`,
            done: "ready to merge",
            aiResponse: entry.answer,
          };

          state.promptInput = "";
          state.loading = false;
          startOneShot();
        } catch (err) {
          state.loading = false;
          state.errorMsg = err && err.message ? err.message : "Loomi AI request failed.";
          render();
        }
      }

      render({ forceScrollBottom: true });
    })();
  </script>
</body>
</html>
